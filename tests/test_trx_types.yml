- case: get_object
  mypy_config: |
    follow_untyped_imports = false
    follow_imports = silent
  main: |
    from asyncdb.aiomysql import Transaction, AioMySQLConnection
    from asyncdb import ResultRow
    from typing import assert_type, Coroutine, Any
    from dataclasses import dataclass
    
    trx = Transaction(AioMySQLConnection())
    
    @dataclass
    class CustomObject:
        pass
    
    def factory() -> CustomObject:
        return CustomObject()
    
    assert_type(trx.get_object("", []), Coroutine[Any, Any, ResultRow])  # type: ignore[unused-coroutine]
    assert_type(trx.get_object("", [], CustomObject), Coroutine[Any, Any, CustomObject])  # type: ignore[unused-coroutine]
    assert_type(trx.get_object("", [], factory), Coroutine[Any, Any, CustomObject])  # type: ignore[unused-coroutine]
