- case: fetch_object
  mypy_config: |
    follow_untyped_imports = false
    follow_imports = silent
  main: |
    from asyncdb.aiomysql import Transaction, AioMySQLConnection, Result
    from asyncdb.aiomysql.cursor import Cursor
    from asyncdb import ResultRow
    from typing import assert_type, Coroutine, Any, Optional
    from dataclasses import dataclass

    trx = Transaction(AioMySQLConnection())
    c = Cursor(AioMySQLConnection())

    @dataclass
    class CustomObject:
        pass

    def factory() -> CustomObject:
        return CustomObject()

    res = Result(trx, c, "")
    
    assert_type(res.fetch_object(), Coroutine[Any, Any, Optional[ResultRow]])  # type: ignore[unused-coroutine]
    assert_type(res.fetch_object(CustomObject), Coroutine[Any, Any, Optional[CustomObject]])  # type: ignore[unused-coroutine]
    assert_type(res.fetch_object(factory), Coroutine[Any, Any, Optional[CustomObject]])  # type: ignore[unused-coroutine]
