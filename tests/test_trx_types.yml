- case: transaction_factory
  mypy_config: |
    follow_untyped_imports = false
    follow_imports = silent
  main: |
    from asyncdb.aiomysql import TransactionFactory, MySQLConfig, Transaction, Result
    from typing import Coroutine, Any
    
    f = TransactionFactory(MySQLConfig())
    
    async def test():
      async with f.transaction() as trx:
        assert_type(trx, Transaction)
        assert_type(trx.query(""), Coroutine[Any, Any, Result])
    
      async with await anext(f()) as trx:
        assert_type(trx, Transaction)
