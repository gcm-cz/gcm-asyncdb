stages:
  - build
  - release

build-wheel:
  image: registry.srv.gcm.cz/baseimage/python:3.11-ci
  stage: build
  script:
    - /ci/build-wheel.sh
  artifacts:
    paths:
      - dist/*

release-wheel:
  image: registry.srv.gcm.cz/baseimage/python:3.11-ci
  stage: release
  dependencies:
    - build-wheel
  only:
    - tags
  script:
    - /ci/release-wheel.sh
